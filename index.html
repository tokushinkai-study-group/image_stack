<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>画像縦つなぎ</title>
<style>
*, *::before, *::after { box-sizing: border-box; }
html { color-scheme: light; }
body { margin: 0; font-size: 14px; }
img { max-width: 100%; }
[hidden] { display: none !important; }

/* Layout: one narrow column — step label, action buttons, thumbnail strip, result */
:root {
  --bg: #f6f7f9;
  --surface: #ffffff;
  --fg: #1d2330;
  --muted: #667085;
  --line: #dfe3ea;
  --accent: #2f6fdb;
  --accent-fg: #ffffff;
  --font-body: "Noto Sans JP", "Hiragino Sans", "Yu Gothic", sans-serif;
  --font-num: "IBM Plex Mono", ui-monospace, monospace;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #14171d; --surface: #1d2129; --fg: #e7eaf0; --muted: #98a2b3;
    --line: #2e3440; --accent: #6b9bf0; --accent-fg: #0f1420; color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #14171d; --surface: #1d2129; --fg: #e7eaf0; --muted: #98a2b3;
  --line: #2e3440; --accent: #6b9bf0; --accent-fg: #0f1420; color-scheme: dark;
}
body {
  background: var(--bg); color: var(--fg); font-family: var(--font-body);
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
  padding-block: 32px 48px;
}
main { max-width: 640px; margin: 0 auto; display: grid; gap: 24px; }
h1 { font-size: 1.5rem; margin: 0; text-wrap: balance; }
.lead { margin: 4px 0 0; color: var(--muted); line-height: 1.7; }
.status { font-family: var(--font-num); font-size: .8rem; letter-spacing: .04em; color: var(--muted); }
.actions { display: flex; flex-wrap: wrap; gap: 12px; }
button {
  font: inherit; font-size: 1rem; font-weight: 600; cursor: pointer;
  padding: 12px 20px; border-radius: 8px; border: 1px solid var(--line);
  background: var(--surface); color: var(--fg);
}
button.primary { background: var(--accent); border-color: var(--accent); color: var(--accent-fg); }
button:hover { filter: brightness(1.05); }
button:focus-visible { outline: 3px solid var(--accent); outline-offset: 2px; }
.thumbs { display: grid; grid-template-columns: repeat(auto-fill, minmax(140px, 1fr)); gap: 12px; }
.thumbs:empty { display: none; }
figure { margin: 0; display: grid; gap: 6px; cursor: grab; touch-action: none; user-select: none; -webkit-user-select: none; }
figure img { pointer-events: none; -webkit-user-drag: none; }
figure.dragging { opacity: .45; cursor: grabbing; }
figure.dragging img { outline: 3px dashed var(--accent); outline-offset: 2px; }
.hint { margin: 0; font-size: .85rem; color: var(--muted); }
figure img { width: 100%; aspect-ratio: 4 / 3; border: 1px solid var(--line); border-radius: 6px; display: block; background: var(--surface); }
figcaption { font-family: var(--font-num); font-size: .75rem; color: var(--muted); }
.result { display: grid; gap: 12px; padding: 16px; background: var(--surface); border: 1px solid var(--line); border-radius: 10px; }
.result h2 { font-size: 1.1rem; margin: 0; }
.result p { margin: 0; color: var(--muted); font-size: .9rem; line-height: 1.6; }
.result img { width: 400px; max-width: 100%; height: auto; display: block; border: 1px solid var(--line); }
</style>
</head>
<body>

<main>
  <header>
    <h1>画像縦つなぎ</h1>
    <p class="lead">画像を1枚ずつ取り込み、縦に結合して1枚の画像にします。取り込んだ画像は横400px × 縦300pxに変換されます。</p>
  </header>

  <div class="status" id="status">取り込み済み 0 枚</div>

  <div class="actions">
    <button class="primary" id="pickBtn" type="button">画像を取り込む</button>
    <button id="mergeBtn" type="button" hidden>以上で画像を結合する</button>
    <button id="resetBtn" type="button" hidden>最初からやり直す</button>
  </div>
  <input type="file" id="fileInput" accept="image/*" hidden>

  <p class="hint" id="hint" hidden>サムネイルをドラッグすると順番を入れ替えられます。上（左）から順に結合されます。</p>
  <section class="thumbs" id="thumbs" aria-label="取り込んだ画像"></section>

  <section class="result" id="result" hidden>
    <h2>結合結果</h2>
    <p id="resultInfo"></p>
    <div class="actions">
      <button class="primary" id="saveBtn" type="button" hidden>画像を保存する（PNG）</button>
    </div>
    <p id="saveMsg">画像を右クリック（スマホは長押し）して「名前を付けて画像を保存」でも保存できます。</p>
    <img id="resultImg" alt="結合した画像">
  </section>
</main>

<script>
const W = 400, H = 300;
const images = []; // { canvas, src } 400x300 に変換済み
const pickBtn = document.getElementById('pickBtn');
const mergeBtn = document.getElementById('mergeBtn');
const resetBtn = document.getElementById('resetBtn');
const fileInput = document.getElementById('fileInput');
const thumbs = document.getElementById('thumbs');
const statusEl = document.getElementById('status');
const hint = document.getElementById('hint');
const result = document.getElementById('result');

pickBtn.addEventListener('click', () => { fileInput.value = ''; fileInput.click(); });

fileInput.addEventListener('change', () => {
  const file = fileInput.files[0];
  if (!file) return;
  const url = URL.createObjectURL(file);
  const img = new Image();
  img.onload = () => {
    const c = document.createElement('canvas');
    c.width = W; c.height = H;
    c.getContext('2d').drawImage(img, 0, 0, W, H);
    URL.revokeObjectURL(url);
    images.push({ canvas: c, src: c.toDataURL('image/png') });
    render();
    update();
  };
  img.onerror = () => { URL.revokeObjectURL(url); statusEl.textContent = 'この画像は読み込めませんでした。別の画像を選んでください。'; };
  img.src = url;
});

// サムネイルを配列の順番どおりに描き直す
function render(dragIndex = -1) {
  thumbs.innerHTML = '';
  images.forEach((item, i) => {
    const fig = document.createElement('figure');
    fig.dataset.index = i;
    if (i === dragIndex) fig.classList.add('dragging');
    const im = document.createElement('img');
    im.src = item.src;
    im.alt = (i + 1) + '枚目';
    im.draggable = false;
    const cap = document.createElement('figcaption');
    cap.textContent = (i + 1) + '枚目 · 400×300';
    fig.append(im, cap);
    thumbs.append(fig);
  });
}

function update() {
  const n = images.length;
  statusEl.textContent = '取り込み済み ' + n + ' 枚';
  pickBtn.textContent = n === 0 ? '画像を取り込む' : '次の画像を選択する';
  mergeBtn.hidden = n < 2 || !result.hidden;
  hint.hidden = n < 2;
}

// ドラッグで並べ替え（マウス・タッチ両対応）
let dragIndex = -1;
thumbs.addEventListener('pointerdown', e => {
  const fig = e.target.closest('figure');
  if (!fig || images.length < 2) return;
  e.preventDefault();
  dragIndex = Number(fig.dataset.index);
  thumbs.setPointerCapture(e.pointerId);
  render(dragIndex);
});
thumbs.addEventListener('pointermove', e => {
  if (dragIndex < 0) return;
  const el = document.elementFromPoint(e.clientX, e.clientY);
  const fig = el && el.closest('#thumbs figure');
  if (!fig) return;
  const over = Number(fig.dataset.index);
  if (over === dragIndex) return;
  const [moved] = images.splice(dragIndex, 1);
  images.splice(over, 0, moved);
  dragIndex = over;
  render(dragIndex);
});
function endDrag() {
  if (dragIndex < 0) return;
  dragIndex = -1;
  render();
  if (!result.hidden) merge(false); // 結合済みなら結果も並べ替えに合わせて更新
}
thumbs.addEventListener('pointerup', endDrag);
thumbs.addEventListener('pointercancel', endDrag);

let mergedCanvas = null;
const saveBtn = document.getElementById('saveBtn');
const saveMsg = document.getElementById('saveMsg');
saveBtn.hidden = false;
saveBtn.addEventListener('click', () => {
  if (!mergedCanvas) return;
  mergedCanvas.toBlob(blob => {
    const d = new Date();
    const stamp = d.getFullYear() + String(d.getMonth() + 1).padStart(2, '0') + String(d.getDate()).padStart(2, '0')
      + '-' + String(d.getHours()).padStart(2, '0') + String(d.getMinutes()).padStart(2, '0');
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a');
    a.href = url;
    a.download = '結合画像-' + stamp + '.png';
    document.body.append(a);
    a.click();
    a.remove();
    setTimeout(() => URL.revokeObjectURL(url), 1000);
    saveMsg.textContent = '保存しました。うまく保存されない場合は、画像を右クリック（スマホは長押し）して保存してください。';
  }, 'image/png');
});

function merge(scroll) {
  const out = document.createElement('canvas');
  out.width = W; out.height = H * images.length;
  const ctx = out.getContext('2d');
  images.forEach((item, i) => ctx.drawImage(item.canvas, 0, i * H));
  mergedCanvas = out;
  document.getElementById('resultImg').src = out.toDataURL('image/png');
  document.getElementById('resultInfo').textContent =
    images.length + '枚を結合しました（横' + W + 'px × 縦' + out.height + 'px）。';
  result.hidden = false;
  pickBtn.hidden = true; mergeBtn.hidden = true; resetBtn.hidden = false;
  if (scroll) result.scrollIntoView({ behavior: 'smooth', block: 'start' });
}
mergeBtn.addEventListener('click', () => merge(true));

resetBtn.addEventListener('click', () => {
  images.length = 0;
  render();
  result.hidden = true;
  pickBtn.hidden = false; resetBtn.hidden = true;
  update();
});
</script>

</body>
</html>
